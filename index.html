<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DP86-32</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        #screen_container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #screen_container canvas {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
        }
        #screen_container > div {
            color: white;
            font-family: monospace;
        }
    </style>
</head>
<body>
<div id="screen_container">
    <div></div>
    <canvas></canvas>
</div>
<script src="./x86/libv86.js"></script>
<script>
"use strict";
window.onload = function () {
    const emulator = new V86({
        wasm_path: "./x86/v86.wasm",
        memory_size: 32 * 1024 * 1024,
        vga_memory_size: 2 * 1024 * 1024,
        screen_container:
            document.getElementById("screen_container"),
        bios: {
            url: "./x86/bios/seabios.bin"
        },
        vga_bios: {
            url: "./x86/bios/vgabios.bin"
        },
        hda: {
            url: "./os.img"
        },
        autostart: true
    };
    window.myos = emulator;
};
</script>
</body>
</html>
